<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Szokáskövető</title>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Szokások"/>
  <style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  /* ── THEMES ── */
  :root{
    --accent:#4a7c62;
    --accent-dim:#4a7c6220;
    --radius:16px;
    --safe-top:env(safe-area-inset-top);
    --safe-bot:env(safe-area-inset-bottom);
  }

  [data-theme="dark"]{
    --bg:#0e0e10;
    --surface:#1c1c1f;
    --surface2:#28282c;
    --border:#2e2e33;
    --text:#f2f2f4;
    --sub:#8e8e96;
    --sub2:#3a3a40;
    --chip-bg:#1f1f23;
  }

  [data-theme="dim"]{
    --bg:#1a1f2e;
    --surface:#232b3e;
    --surface2:#2c3650;
    --border:#323d56;
    --text:#dde3f0;
    --sub:#7a87a8;
    --sub2:#2a3248;
    --chip-bg:#1e2638;
  }

  [data-theme="light"]{
    --bg:#f4f4f0;
    --surface:#ffffff;
    --surface2:#f0f0ec;
    --border:#e2e2dc;
    --text:#18181a;
    --sub:#8a8a8e;
    --sub2:#e0e0da;
    --chip-bg:#f8f8f5;
  }

  body{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100dvh;
    padding-top:var(--safe-top);
    transition:background .25s,color .25s;
  }

  /* ── HEADER ── */
  .header{
    padding:20px 20px 0;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }

  .header-left h1{
    font-size:1.55rem;
    font-weight:700;
    letter-spacing:-.03em;
  }

  .header-left .date-sub{
    font-size:.78rem;
    color:var(--sub);
    margin-top:3px;
  }

  .header-right{display:flex;gap:8px;}

  .icon-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:1rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .15s;
  }
  .icon-btn:active{opacity:.6;}

  /* ── THEME PICKER ── */
  .theme-bar{
    display:flex;
    gap:6px;
    padding:10px 20px 0;
  }

  .theme-chip{
    flex:1;
    padding:7px 0;
    border-radius:20px;
    border:1.5px solid var(--border);
    background:var(--chip-bg);
    color:var(--sub);
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    cursor:pointer;
    text-align:center;
    transition:all .15s;
  }

  .theme-chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* ── WEEK STRIP ── */
  .week-strip{
    display:flex;
    gap:4px;
    padding:16px 20px 0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .week-strip::-webkit-scrollbar{display:none;}

  .wday{
    flex:1;
    min-width:38px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    cursor:pointer;
  }

  .wday-label{
    font-size:.62rem;
    font-weight:500;
    color:var(--sub);
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  .wday-num{
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:.85rem;
    font-weight:500;
    color:var(--sub);
    position:relative;
    transition:all .15s;
  }

  .wday.selected .wday-num{
    background:var(--accent);
    color:#fff;
    font-weight:700;
  }

  .wday.today:not(.selected) .wday-num{
    border:1.5px solid var(--accent);
    color:var(--accent);
  }

  .wday-dot{
    width:5px;height:5px;
    border-radius:50%;
    background:transparent;
    transition:background .15s;
  }

  .wday.has-done .wday-dot{background:var(--accent);}
  .wday.selected .wday-dot{background:#ffffff80;}

  /* ── PROGRESS ── */
  .progress-section{
    padding:16px 20px 0;
  }

  .progress-top{
    display:flex;justify-content:space-between;
    align-items:baseline;margin-bottom:7px;
  }

  .progress-top span:first-child{
    font-size:.7rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;
    color:var(--sub);
  }

  .progress-top span:last-child{
    font-size:.8rem;font-weight:600;color:var(--text);
  }

  .progress-track{
    height:3px;background:var(--surface2);
    border-radius:2px;overflow:hidden;
  }

  .progress-fill{
    height:100%;background:var(--accent);
    border-radius:2px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
    width:0;
  }

  /* ── SELECTED DAY LABEL ── */
  .day-label-row{
    padding:18px 20px 4px;
    display:flex;justify-content:space-between;align-items:center;
  }

  .day-label{
    font-size:.72rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;
    color:var(--sub);
  }

  .retro-badge{
    font-size:.68rem;
    background:var(--accent-dim);
    color:var(--accent);
    padding:3px 10px;border-radius:20px;
    font-weight:600;
    display:none;
  }

  .retro-badge.visible{display:block;}

  /* ── HABIT LIST ── */
  .habit-list{padding:0 20px;}

  .habit-card{
    background:var(--surface);
    border-radius:14px;
    padding:14px 14px;
    margin-bottom:8px;
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--border);
    transition:opacity .2s;
  }

  .habit-card.done{opacity:.5;}
  .habit-card.done .habit-name{text-decoration:line-through;color:var(--sub);}

  .habit-icon{
    width:44px;height:44px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;
    background:var(--accent-dim);
    flex-shrink:0;
    transition:background .2s;
  }

  .habit-card.done .habit-icon{
    background:var(--accent);
  }

  .habit-body{flex:1;min-width:0;}

  .habit-name{
    font-size:.95rem;font-weight:500;
    letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .habit-streak{
    font-size:.72rem;color:var(--sub);margin-top:2px;
  }

  .habit-right{display:flex;align-items:center;gap:8px;}

  .check-btn{
    width:28px;height:28px;
    border-radius:50%;
    border:1.5px solid var(--sub2);
    background:none;cursor:pointer;
    color:var(--bg);font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s;flex-shrink:0;
  }

  .habit-card.done .check-btn{
    background:var(--accent);border-color:var(--accent);
  }

  .check-btn:active{transform:scale(.82);}

  .more-btn{
    background:none;border:none;
    color:var(--sub2);font-size:1.1rem;
    cursor:pointer;padding:2px 4px;line-height:1;
  }
  .more-btn:active{color:var(--sub);}

  /* ── EMPTY ── */
  .empty{
    text-align:center;padding:52px 0 20px;
    color:var(--sub);
  }
  .empty .e-ico{font-size:2rem;margin-bottom:10px;}
  .empty p{font-size:.85rem;line-height:1.6;}

  /* ── BOTTOM NAV ── */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    padding:10px 0 calc(var(--safe-bot) + 10px);
    z-index:50;
  }

  .nav-item{
    flex:1;display:flex;flex-direction:column;
    align-items:center;gap:3px;
    cursor:pointer;
    color:var(--sub);
    font-size:.6rem;font-weight:500;
    letter-spacing:.04em;
    text-transform:uppercase;
    transition:color .15s;
  }

  .nav-item.active{color:var(--accent);}
  .nav-item .nav-ico{font-size:1.2rem;}

  .nav-fab{
    flex:1;display:flex;align-items:center;justify-content:center;
  }

  .fab{
    width:52px;height:52px;
    border-radius:50%;
    background:var(--accent);
    border:none;color:#fff;
    font-size:1.5rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px #4a7c6240;
    margin-top:-16px;
    transition:transform .15s;
  }
  .fab:active{transform:scale(.88);}

  .bottom-space{height:calc(var(--safe-bot) + 88px);}

  /* ── SHEET ── */
  .overlay{
    display:none;position:fixed;inset:0;
    background:#00000060;z-index:100;
    align-items:flex-end;
  }
  .overlay.open{display:flex;}

  .sheet{
    background:var(--surface);width:100%;
    border-radius:22px 22px 0 0;
    padding:0 0 calc(var(--safe-bot)+16px);
    animation:slideUp .28s cubic-bezier(.32,1,.35,1);
    max-height:92dvh;overflow-y:auto;
  }

  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  .sheet-handle{
    width:36px;height:4px;
    background:var(--sub2);border-radius:2px;
    margin:12px auto 0;
  }

  .sheet-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px 12px;
    border-bottom:1px solid var(--border);
  }

  .sheet-title{font-size:.97rem;font-weight:600;}

  .sheet-save{
    background:none;border:none;
    color:var(--accent);font-size:.95rem;
    font-weight:600;font-family:inherit;cursor:pointer;
  }

  .sheet-body{padding:16px 20px;}

  .field{margin-bottom:20px;}

  .field-label{
    font-size:.68rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;
    color:var(--sub);margin-bottom:8px;
  }

  .text-input{
    width:100%;
    background:var(--surface2);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:13px 14px;
    font-size:.95rem;font-family:inherit;
    color:var(--text);outline:none;
    transition:border-color .15s;
  }
  .text-input:focus{border-color:var(--accent);}

  /* Icon accordion */
  .icon-group{ margin-bottom:6px; }

  .ig-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 10px;
    background:var(--surface2);
    border-radius:10px;
    cursor:pointer;
    user-select:none;
    border:1px solid var(--border);
    transition:background .15s;
  }
  .ig-header:active{background:var(--sub2);}

  .ig-header-left{display:flex;align-items:center;gap:8px;}
  .ig-cat-icon{font-size:1rem;}
  .ig-cat-name{font-size:.8rem;font-weight:600;color:var(--text);}
  .ig-chevron{
    font-size:.7rem;color:var(--sub);
    transition:transform .2s;
    display:inline-block;
  }
  .icon-group.open .ig-chevron{transform:rotate(180deg);}

  .ig-grid{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:5px;
    padding:8px 2px 2px;
    display:none;
  }
  .icon-group.open .ig-grid{display:grid;}

  .ig-btn{
    aspect-ratio:1;
    border:1.5px solid var(--border);
    border-radius:10px;
    background:var(--surface2);
    font-size:1.15rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .12s;
  }

  .ig-btn.sel{
    background:var(--accent);
    border-color:var(--accent);
    transform:scale(1.08);
  }

  /* Color row */
  .color-row{display:flex;gap:8px;flex-wrap:wrap;}

  .c-dot{
    width:30px;height:30px;border-radius:50%;
    cursor:pointer;
    border:2.5px solid transparent;
    outline:2.5px solid transparent;
    outline-offset:2px;
    transition:outline-color .12s;
  }
  .c-dot.sel{outline-color:var(--text);}

  /* ── CONTEXT MENU ── */
  .ctx-menu{
    display:none;position:fixed;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px;z-index:200;
    box-shadow:0 8px 32px #00000030;
    min-width:160px;
  }
  .ctx-menu.open{display:block;}

  .ctx-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:9px;
    font-size:.88rem;cursor:pointer;
    color:var(--text);transition:background .1s;
  }
  .ctx-item:hover{background:var(--surface2);}
  .ctx-item.danger{color:#ef4444;}

  /* ── TOAST ── */
  .toast{
    position:fixed;
    bottom:calc(var(--safe-bot) + 96px);
    left:50%;
    transform:translateX(-50%) translateY(8px);
    background:var(--text);color:var(--bg);
    padding:9px 18px;border-radius:30px;
    font-size:.82rem;font-weight:600;
    z-index:300;opacity:0;
    transition:opacity .22s,transform .22s;
    white-space:nowrap;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body data-theme="dark">

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h1 id="greet">Szokásaim</h1>
    <div class="date-sub" id="dateSub"></div>
  </div>
  <div class="header-right">
    <button class="icon-btn" title="Téma" onclick="cycleTheme()">◐</button>
  </div>
</div>

<!-- THEME CHIPS -->
<div class="theme-bar">
  <div class="theme-chip active" data-t="dark"   onclick="setTheme('dark')">Sötét</div>
  <div class="theme-chip"        data-t="dim"    onclick="setTheme('dim')">Közép</div>
  <div class="theme-chip"        data-t="light"  onclick="setTheme('light')">Világos</div>
</div>

<!-- WEEK -->
<div class="week-strip" id="weekStrip"></div>

<!-- PROGRESS -->
<div class="progress-section">
  <div class="progress-top">
    <span>Haladás</span>
    <span id="progressText">0 / 0</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- DAY LABEL -->
<div class="day-label-row">
  <div class="day-label" id="dayLabel">Ma</div>
  <div class="retro-badge" id="retroBadge">Visszamenőleges</div>
</div>

<!-- LIST -->
<div class="habit-list" id="habitList"></div>

<div class="bottom-space"></div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active">
    <span class="nav-ico">◉</span>
    <span>Ma</span>
  </div>
  <div class="nav-fab">
    <button class="fab" onclick="openSheet()">+</button>
  </div>
  <div class="nav-item" onclick="openSheet()">
    <span class="nav-ico">⊕</span>
    <span>Új</span>
  </div>
</div>

<!-- SHEET -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheetTitle">Új szokás</div>
      <button class="sheet-save" onclick="saveHabit()">Mentés</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <div class="field-label">Megnevezés</div>
        <input class="text-input" id="nameInput" placeholder="pl. Reggeli futás" maxlength="40"/>
      </div>
      <div class="field">
        <div class="field-label">Ikon</div>
        <div id="iconAccordion"></div>
      </div>
      <div class="field">
        <div class="field-label">Szín</div>
        <div class="color-row" id="colorRow"></div>
      </div>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="ctxEdit()">✏️ &nbsp;Szerkesztés</div>
  <div class="ctx-item danger" onclick="ctxDelete()">🗑️ &nbsp;Törlés</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── DATA ── */
const ICON_GROUPS=[
  {name:'Sport & mozgás',   icon:'🏃', icons:['🏃','🚶','🚴','🏋️','🧘','🤸','🏊','⛹️','🧗','🤾','🏄','⛷️','🎾','⚽','🏀','🥊']},
  {name:'Étel & ital',      icon:'🥗', icons:['💧','🥗','🍎','🥦','☕','🍵','🥤','🧃','🥑','🫐','🥕','🍋','🥣','🫖','🍇','🥩']},
  {name:'Egészség',         icon:'💊', icons:['💊','🩺','🦷','🧴','🧼','🌿','🌸','💐','🩹','🧪','🌡️','💉','🫀','🧬','🩻','🏥']},
  {name:'Pihenés & mentál', icon:'😴', icons:['😴','🛌','🌙','⏰','🧖','🛁','😌','🌬️','🧘‍♀️','🛀','☮️','🕯️','🌅','🌄','💆','🌊']},
  {name:'Tanulás & munka',  icon:'📚', icons:['📚','✍️','🎯','🧠','💡','📝','📖','🗒️','💻','📊','📈','🔬','🎓','🖊️','📐','🗂️']},
  {name:'Kreativitás',      icon:'🎨', icons:['🎸','🎹','🎨','✏️','🎭','📷','🎬','🎧','🎮','🎲','🧩','🪡','🎻','🪗','🎤','🎼']},
  {name:'Háztartás & élet', icon:'🏠', icons:['🧹','🏠','🌱','♻️','💰','📱','🚫','⭐','❤️','🙏','🐕','🐈','🌞','🔥','✨','🪴']},
];

// flat list for compatibility
const ICONS = ICON_GROUPS.flatMap(g=>g.icons);

const COLORS=[
  // zöldek
  '#4a7c62','#2d6a4f','#52796f','#74a57f','#95bf8f','#b5c99a','#6b7c3d','#3a5a40',
  // kékek
  '#1e3a5f','#2563eb','#3b82f6','#60a5fa','#0ea5e9','#0891b2','#164e63','#4f86c6',
  // lilák / rózsák
  '#6d28d9','#7c3aed','#a855f7','#c084fc','#db2777','#ec4899','#9d174d','#be185d',
  // narancsok / pirosak
  '#92400e','#b45309','#d97706','#f59e0b','#c2410c','#ea580c','#f97316','#ef4444',
  // semlegesek
  '#1c1917','#44403c','#78716c','#a8a29e','#292524','#57534e','#374151','#6b7280',
];

let habits  = JSON.parse(localStorage.getItem('sz2_habits') || '[]');
let doneMap = JSON.parse(localStorage.getItem('sz2_done')   || '{}');
let theme   = localStorage.getItem('sz2_theme') || 'dark';

let editId   = null;
let ctxId    = null;
let selIcon  = ICONS[0];
let selColor = COLORS[0];
let selDate  = todayKey();  // currently viewed date

function todayKey(){ return new Date().toISOString().slice(0,10); }

function save(){
  localStorage.setItem('sz2_habits', JSON.stringify(habits));
  localStorage.setItem('sz2_done',   JSON.stringify(doneMap));
}

/* ── THEME ── */
function setTheme(t){
  theme = t;
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('sz2_theme', t);
  document.querySelectorAll('.theme-chip').forEach(c=>{
    c.classList.toggle('active', c.dataset.t === t);
  });
}

function cycleTheme(){
  const order=['dark','dim','light'];
  setTheme(order[(order.indexOf(theme)+1)%3]);
}

/* ── HEADER ── */
function initHeader(){
  const d=new Date();
  const months=['január','február','március','április','május','június',
                'július','augusztus','szeptember','október','november','december'];
  const h=d.getHours();
  const greets=h<10?'Jó reggelt!':h<18?'Jó napot!':h<22?'Jó estét!':'Jó éjszakát!';
  document.getElementById('greet').textContent = greets;
  document.getElementById('dateSub').textContent =
    `${d.getFullYear()}. ${months[d.getMonth()]} ${d.getDate()}.`;
}

/* ── WEEK STRIP ── */
function buildWeek(){
  const strip = document.getElementById('weekStrip');
  strip.innerHTML='';
  const today = new Date();
  const DAY=['V','H','K','Sz','Cs','P','Sz'];
  for(let i=6;i>=0;i--){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const isToday=i===0;
    const isSelected=key===selDate;
    const hasDone=habits.some(h=>doneMap[key]?.[h.id]);
    const el=document.createElement('div');
    el.className='wday'+(isToday?' today':'')+(isSelected?' selected':'')+(hasDone?' has-done':'');
    el.innerHTML=`<div class="wday-label">${DAY[d.getDay()]}</div>
                  <div class="wday-num">${d.getDate()}</div>
                  <div class="wday-dot"></div>`;
    el.onclick=()=>{ selDate=key; render(); };
    strip.appendChild(el);
  }
}

/* ── PROGRESS ── */
function updateProgress(){
  const total=habits.length;
  const count=habits.filter(h=>doneMap[selDate]?.[h.id]).length;
  const pct=total?count/total*100:0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${count} / ${total}`;
}

/* ── DAY LABEL ── */
function updateDayLabel(){
  const tk=todayKey();
  const isToday=selDate===tk;
  const d=new Date(selDate+'T12:00:00');
  const days=['vasárnap','hétfő','kedd','szerda','csütörtök','péntek','szombat'];
  document.getElementById('dayLabel').textContent=
    isToday?'Ma':days[d.getDay()]+', '+d.getDate()+'.';
  document.getElementById('retroBadge').classList.toggle('visible',!isToday);
}

/* ── STREAK ── */
function getStreak(id){
  let s=0;
  const today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today);
    d.setDate(today.getDate()-i);
    if(doneMap[d.toISOString().slice(0,10)]?.[id])s++;
    else break;
  }
  return s;
}

/* ── RENDER ── */
function render(){
  buildWeek();
  updateProgress();
  updateDayLabel();
  const list=document.getElementById('habitList');
  list.innerHTML='';
  if(!habits.length){
    list.innerHTML=`<div class="empty">
      <div class="e-ico">✦</div>
      <p>Még nincs szokásod.<br>Koppints a + gombra az első hozzáadásához.</p>
    </div>`;
    return;
  }
  habits.forEach(h=>{
    const isDone=!!doneMap[selDate]?.[h.id];
    const streak=getStreak(h.id);
    const card=document.createElement('div');
    card.className='habit-card'+(isDone?' done':'');
    card.innerHTML=`
      <div class="habit-icon" style="background:${h.color}22">${h.icon}</div>
      <div class="habit-body">
        <div class="habit-name">${h.name}</div>
        <div class="habit-streak">${streak>0?`🔥 ${streak} napos sorozat`:'Kezdd el ma'}</div>
      </div>
      <div class="habit-right">
        <button class="check-btn" onclick="toggle('${h.id}')">${isDone?'✓':''}</button>
        <button class="more-btn" onclick="openCtx(event,'${h.id}')">···</button>
      </div>`;
    list.appendChild(card);
  });
}

function toggle(id){
  if(!doneMap[selDate]) doneMap[selDate]={};
  const was=!!doneMap[selDate][id];
  doneMap[selDate][id]=!was;
  if(!was){
    const h=habits.find(x=>x.id===id);
    showToast(`${h?.icon||''} Kész!`);
  }
  save();
  render();
}

/* ── SHEET ── */
function openSheet(id=null){
  editId=id;
  const h=id?habits.find(x=>x.id===id):null;
  document.getElementById('sheetTitle').textContent=h?'Szerkesztés':'Új szokás';
  document.getElementById('nameInput').value=h?.name||'';
  selIcon=h?.icon||ICONS[0];
  selColor=h?.color||COLORS[0];
  renderIconGrid();
  renderColorRow();
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('nameInput').focus(),320);
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
}

function overlayClick(e){
  if(e.target===document.getElementById('overlay'))closeSheet();
}

function renderIconGrid(){
  const acc=document.getElementById('iconAccordion');
  acc.innerHTML='';
  ICON_GROUPS.forEach((group,gi)=>{
    const hasSelected=group.icons.includes(selIcon);
    const isOpen=hasSelected;
    const wrap=document.createElement('div');
    wrap.className='icon-group'+(isOpen?' open':'');

    const header=document.createElement('div');
    header.className='ig-header';
    header.innerHTML=`<div class="ig-header-left">
      <span class="ig-cat-icon">${group.icon}</span>
      <span class="ig-cat-name">${group.name}</span>
    </div><span class="ig-chevron">▼</span>`;
    header.onclick=()=>{ wrap.classList.toggle('open'); };

    const grid=document.createElement('div');
    grid.className='ig-grid';
    group.icons.forEach(ic=>{
      const b=document.createElement('button');
      b.className='ig-btn'+(ic===selIcon?' sel':'');
      b.textContent=ic;
      b.onclick=()=>{ selIcon=ic; renderIconGrid(); };
      grid.appendChild(b);
    });

    wrap.appendChild(header);
    wrap.appendChild(grid);
    acc.appendChild(wrap);
  });
}

function renderColorRow(){
  const r=document.getElementById('colorRow');
  r.innerHTML='';
  COLORS.forEach(c=>{
    const d=document.createElement('div');
    d.className='c-dot'+(c===selColor?' sel':'');
    d.style.background=c;
    d.onclick=()=>{selColor=c;renderColorRow();};
    r.appendChild(d);
  });
}

function saveHabit(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name){document.getElementById('nameInput').focus();return;}
  if(editId){
    const h=habits.find(x=>x.id===editId);
    if(h){h.name=name;h.icon=selIcon;h.color=selColor;}
  } else {
    habits.push({id:Date.now().toString(36),name,icon:selIcon,color:selColor});
    showToast('Szokás hozzáadva ✦');
  }
  save();
  closeSheet();
  render();
}

/* ── CONTEXT ── */
function openCtx(e,id){
  e.stopPropagation();
  ctxId=id;
  const menu=document.getElementById('ctxMenu');
  menu.classList.add('open');
  const r=e.target.getBoundingClientRect();
  const mw=165;
  let left=r.right-mw;
  if(left<8)left=8;
  menu.style.left=left+'px';
  menu.style.top=(r.bottom+6)+'px';
  document.addEventListener('click',()=>menu.classList.remove('open'),{once:true});
}

function ctxEdit(){
  document.getElementById('ctxMenu').classList.remove('open');
  openSheet(ctxId);
}

function ctxDelete(){
  document.getElementById('ctxMenu').classList.remove('open');
  habits=habits.filter(h=>h.id!==ctxId);
  save();
  render();
  showToast('Törölve');
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
}

document.getElementById('nameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter')saveHabit();
});

/* ── INIT ── */
setTheme(theme);
initHeader();
render();
</script>
</body>
</html>
